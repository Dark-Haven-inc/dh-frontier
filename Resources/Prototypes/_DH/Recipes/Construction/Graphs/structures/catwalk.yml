- type: constructionGraph
  id: WCatwalk
  start: start
  graph:
    - node: start
      edges:
        - to: WCatwalk
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: MaterialWoodPlank
              amount: 4

    - node: WCatwalk
      entity: WoodCatwalk
      edges:
        - to: start
          completed:
          - !type:SpawnPrototype
                prototype: MaterialWoodPlank
                amount: 4
          - !type:DeleteEntity {}
          steps:
            - tool: Cutting
