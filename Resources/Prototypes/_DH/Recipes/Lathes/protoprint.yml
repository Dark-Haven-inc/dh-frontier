- type: entity
  parent: BaseItem
  id: FakeSpaceCash
  suffix: Fake
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      FakeCredit: 1
  - type: Item
    shape:
    - 0,0,1,0
    storedOffset: 0,-2
  - type: StaticPrice
    price: 0
  - type: Stack
    stackType: Credit
    count: 1
    baseLayer: base
    layerStates:
    - cash
    - cash_10
    - cash_100
    - cash_500
    - cash_1000
    - cash_5000
    - cash_10000
    - cash_25000
    - cash_50000
    - cash_100000
    - cash_1000000
    layerFunction: Threshold
  - type: StackLayerThreshold
    thresholds: [10, 100, 500, 1000, 5000, 10000, 25000, 50000, 100000, 1000000]
  - type: Sprite
    sprite: Objects/Economy/cash.rsi
    state: cash
    layers:
    - state: cash
      map: ["base"]
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        density: 30
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.2,0.25,0.1"
        mask:
        - ItemMask
  - type: Appearance

- type: material
  id: FakeCredit
  name: title-speso
  unit: materials-unit-bill
  stackEntity: FakeSpaceCash
  icon: { sprite: /Textures/Objects/Economy/cash.rsi, state: cash }
  price: 0

- type: stack
  id: FakeCredit
  name: title-speso
  icon: { sprite: /Textures/Objects/Economy/cash.rsi, state: cash }
