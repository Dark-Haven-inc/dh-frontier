- type: entity
  parent: ClothingHandsGlovesCombatLua
  id: ClothingHandsGlovesCombatFS
  name: боевые перчатки "FS"
  description: Боевые перчатки из высокопрочных материалов, обеспечивающие защиту в работе с опасными объектами.
  suffix: sponsor, FS #DH
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.98
        Slash: 0.96
        Piercing: 0.99
  - type: Sprite
    sprite: _DH/special/FS/Clothing/gloves.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: _DH/special/FS/Clothing/gloves.rsi
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True:
            sprite: _DH/special/FS/Clothing/gloves.rsi
            state: icon_active
          False:
            sprite: _DH/special/FS/Clothing/gloves.rsi
            state: icon
  - type: PointLight
    color: "#3af5f5"
    radius: 2.5
    energy: 1
  - type: StaminaDamageOnHit
    damage: 28
    sound: /Audio/Weapons/egloves.ogg
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.7
    autoAttack: true
    angle: 100
    damage:
        types:
          Slash: 8
          Heat: 6
          Structural: 10
    mustBeEquippedToUse: true
    animation: WeaponArcClaw
    wideAnimation: WeaponArcClaw
    soundSwing:
      path: /Audio/Weapons/eblademiss.ogg
      params:
        volume: 3
        variation: 0.025
    soundHit:
      path: /Audio/Weapons/eblade1.ogg
      params:
        volume: 3
        variation: 0.025
  - type: ToggleClothing
    action: ActionToggleBladeFS
    disableOnUnequip: true
  # - type: HardsuitAcidifier

