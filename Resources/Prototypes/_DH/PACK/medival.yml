#Water

- type: entity
  id: FloorWaterEntityMedieval
  name: water
  description: A real thirst quencher.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: FloorOccluder
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: _DH/Tiles/Planet/water_new.rsi
    drawdepth: BelowFloor
  - type: SolutionContainerManager
    solutions:
      pool:
        maxVol: 9999999 #.inf seems to break the whole yaml file, but would definitely be preferable.
        reagents:
        - ReagentId: Water
          Quantity: 9999999
  - type: SolutionRegeneration
    solution: tank
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 1000
  - type: DrainableSolution
    solution: pool
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWater
      params:
        volume: 8
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
        - Catwalk
  - type: TileEntityEffect
    effects:
    - !type:ExtinguishReaction
  - type: IconSmooth
    key: water
    base: water
  - type: AmbientSound
    volume: -13
    range: 2
    sound:
      path: _DH/Medieval/water.ogg

- type: entity
  id: MedievalWaterDeepDarkEntity
  name: water
  description: A real thirst quencher.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  #- type: MedievalNotAllowDash
  - type: IconSmooth
    key: waterdeep
    base: water
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    sprite: _DH/Tiles/Planet/water_new.rsi
    drawdepth: Overdoors
  - type: MovementSpeedModifier
    walkSpeedModifier: 0.25
    sprintSpeedModifier: 0.25
    ignoreWhitelist:
      tags:
      - Lamian
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.24,-0.24,0.24,0.24"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWater
      params:
        volume: 12
