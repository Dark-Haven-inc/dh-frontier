- type: constructionGraph
  id: MedievalStockade
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: medievalstockade
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: WoodPlank
              amount: 6
              doAfter: 6
    - node: medievalstockade
