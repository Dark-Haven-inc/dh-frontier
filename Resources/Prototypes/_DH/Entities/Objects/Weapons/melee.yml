- type: entity
  name: дубинка-шокер спецсил
  parent: Stunbaton
  id: StunbatonSuper
  description: Электрошоковая дубинка для обездвиживания людей. Слишком усердное причинение вреда с помощью этого предмета считается дурным тоном.
  components:
    - type: Stunbaton
      energyPerUse: 10

- type: entity
  id: Telebaton
  name: telebaton
  parent: BaseItem
  description: A compact yet robust personal defense weapon.
  components:
  - type: ItemToggle
    soundActivate:
      path: /Audio/Weapons/telescopicon.ogg
      params:
        volume: -5
    soundDeactivate:
      path: /Audio/Weapons/telescopicoff.ogg
      params:
        volume: -5
  - type: ItemToggleSize
    activatedSize: Normal
    activatedShape:
    - 0,0,0,2
  - type: DisarmMalus
    malus: 0.225
  - type: Sprite
    sprite: _DH/Objects/Weapons/Melee/telebaton.rsi
    layers:
    - state: telebaton_off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Blunt: 3
    deactivatedSecret: true
  - type: MeleeWeapon
    attackRate: 1
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 0
  - type: Telescopicbaton
  - type: StaminaDamageOnHit
    damage: 20
  - type: UseDelay
    delay: 0.4
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_DH/Items/Handling/Telebatons/pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_DH/Items/Handling/Telebatons/drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_DH/Items/Handling/Telebatons/drop.ogg
  - type: Item
    sprite: _DH/Objects/Weapons/Melee/telebaton.rsi
    size: Small
    shape:
    - 0,0,0,0
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: telebaton_on}
          False: {state: telebaton_off}
  - type: StaticPrice
    price: 100

- type: entity
  name: Булава
  parent: [BaseC2ContrabandUnredeemable, BaseItem]
  id: mace
  description: Большой и мощный молот с длинной ручкой. Точечные удары значительно сильнее.
  components:
  - type: Sprite
    sprite: _DH/Objects/Weapons/Melee/mace.rsi
    state: icon
  - type: Item
    size: Huge
  - type: MeleeWeapon
    range: 1.15
    autoAttack: true
    wideAnimation: WeaponArcMaceSlash
    angle: 145
    wideAnimationRotation: 220
    bluntStaminaDamageFactor: 1.45
    clickDamageModifier: 1.72
    attackRate: 0.72
    damage:
      types:
        Blunt: 6
        Piercing: 2
        Structural: 4
    soundHit:
      collection: mace
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 18
        Piercing: 4
        Structural: 16
  - type: Tool
    qualities:
      - Prying
    speedModifier: 0.3
  - type: Prying
    speedModifier: 0.3
    pryPowered: !type:Bool
      false
    force: !type:Bool
      true
  - type: Clothing
    sprite: Nyanotrasen/Objects/Weapons/Melee/breaching_hammer.rsi
    quickEquip: false
    equipDelay: 1.6
    unequipDelay: 0.5
    slots:
    - back
    - suitStorage # Frontier - Same as axe
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 6
  - type: StaminaDamageOnCollide
    damage: 30
  - type: ClothingSpeedModifier
    sprintModifier: 0.91
  - type: HeldSpeedModifier
    sprintModifier: 0.85
    mirrorClothingModifier: false

- type: entity
  id: WeaponArcMaceSmash
  parent: WeaponArcStatic
  categories: [ HideSpawnMenu ]
  components:
    - type: WeaponArcVisuals
      fadeOut: false
    - type: Sprite
      state: smash
      scale: 1.6, 1.6
      color: "#fff4cf"
    - type: TimedDespawn
      lifetime: 0.3
    - type: StaminaDamageOnCollide
      damage: 50
    - type: DamageOtherOnHit
      damage:
        types:
          Blunt: 3

- type: entity
  id: WeaponArcMaceSlash
  parent: WeaponArcStatic
  categories: [ HideSpawnMenu ]
  components:
    - type: WeaponArcVisuals
      animation: Slash
    - type: Sprite
      state: smash
      scale: 1.6, 1.6
      color: "#fff4cf"
    - type: StaminaDamageOnCollide
      damage: 50
    - type: DamageOtherOnHit
      damage:
        types:
          Blunt: 3
