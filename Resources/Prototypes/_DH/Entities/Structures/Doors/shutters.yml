  suffix: Угловой
  components:
  - type: Occluder
  - type: Sprite
    sprite: _DH/Structures/Doors/Shutters/tinted_diagonal.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]

- type: entity
  id: ShuttersTintedWindowDiagonal2
  parent: ShuttersTintedWindow
  name: тонированные ставни
  description: Избавят вас от нужды наблюдать за происходящим за окном в одно нажатие.
  suffix: Диагональ
  components:
  - type: Occluder
  - type: Sprite
    sprite: _DH/Structures/Doors/Shutters/tinted_diagonal2.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer

- type: entity
  id: ShuttersDark
  parent: BaseShutter
  name: чёрные ставни
  description: Страшно подумать, что могут скрывать эти ставни.
  components:
  - type: Occluder
  - type: Sprite
    sprite: _DH/Structures/Doors/Shutters/shutters_black.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]

- type: entity
  id: ShuttersElectro
  parent: BaseShutter
  name: электро-ставни
  description: Страшно подумать, что могут скрывать эти ставни.
  components:
  - type: Occluder
  - type: Sprite
    sprite: _DH/Structures/Doors/Shutters/shutters_electro.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: electrified
      sprite: Effects/electricity.rsi
      map: ["enum.ElectrifiedLayers.Sparks"]
      shader: unshaded
      visible: false
    - type: Electrified
      onHandInteract: true
      requirePower: true
      noWindowInTile: false
      highVoltageNode: high
      mediumVoltageNode: medium
      lowVoltageNode: low
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
          layer:
          - GlassLayer
    - type: GenericVisualizer
      visuals:
        enum.ElectrifiedVisuals.ShowSparks:
          enum.ElectrifiedLayers.Sparks:
            True: { visible: True }
            False: { visible: False }

