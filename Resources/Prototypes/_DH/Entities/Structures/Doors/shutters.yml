- type: entity
  id: ShuttersTintedWindow
  parent: BaseShutter
  name: тонированные ставни
  description: Избавят вас от нужды наблюдать за происходящим за окном в одно нажатие.
  components:
  - type: Sprite
    sprite: _DH/Structures/Doors/Shutters/tinted.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Occluder
  - type: Door
    openDrawDepth: BlastDoors
    closedDrawDepth: BlastDoors
    bumpOpen: false
    clickOpen: false
    closeTimeOne: 0.2
    closeTimeTwo: 1.2
    openTimeOne: 1.2
    openTimeTwo: 0.2
    openingAnimationTime: 1.4
    closingAnimationTime: 1.4
    crushDamage:
      types:
        Blunt: 5
    openSound:
      path: /Audio/Machines/shutter.ogg
    closeSound:
      path: /Audio/Machines/shutter.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Weldable
    isWelded: false
  - type: RadiationBlocker
    enabled: false
  - type: InteractionPopup
    interactSuccessString: comp-window-knock
    messagePerceivedByOthers: comp-window-knock
    interactSuccessSound:
      path: /Audio/Effects/glass_knock.ogg
#  - type: Construction
#    graph: Shutters
#    node: ShuttersRadiation
#    containers:
#    - board

- type: entity
  id: ShuttersTintedWindowDiagonal
  parent: ShuttersTintedWindow
