- type: entity
  id: ComputerShipyardClown
  parent: [BaseStructureDisableToolUse, BaseStructureIndestructible, ComputerShipyard]
  name: Хонк-Верфь
  description: Особая верфь для настоящих космо-клоунов!
  components:
  - type: ActivatableUI
    key: enum.ShipyardConsoleUiKey.Honk
  - type: UserInterface
    interfaces:
      enum.ShipyardConsoleUiKey.Honk:
        type: ShipyardConsoleBoundUserInterface
  - type: Sprite
    sprite: _DH/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer_clown
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard_clean
    - map: ["computerLayerScreen"]
      state: shipyard
    - map: ["computerLayerKeys"]
      state: generic_keys

