- type: entity
  id: ScienceMothershipComputer
  parent: BaseMothershipComputer
  name: science shipyard console
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer_medical
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard_clean
    - map: ["computerLayerScreen"]
      state: contraband
    - map: ["computerLayerKeys"]
      state: telesci_key
  - type: ShipyardConsole
    newAccessLevels: [Captain, Research]
  - type: ShipyardListing
    shuttles:
    - Investigator
    - GFSYRiman
    - Lyrae
    - Pulsar
    - Victoria
    - Phoenix
    - Spectre
    - MonoKestrel
    - Sakuratsu
    - Iapetus
