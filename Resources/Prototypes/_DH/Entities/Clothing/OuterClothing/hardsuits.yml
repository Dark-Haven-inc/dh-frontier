  components:
  - type: Storage
    grid:
    - 0,0,7,5
    whitelist:
      tags:
        - BluespaceBox
  - type: Sprite
    sprite: _DH/Clothing/OuterClothing/Suits/cargo-suit.rsi
  - type: Clothing
    sprite: _DH/Clothing/OuterClothing/Suits/cargo-suit.rsi
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: HeldSpeedModifier
